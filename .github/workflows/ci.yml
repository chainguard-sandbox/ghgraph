# CI: the pre-commit gate plus the supply-chain checks (DESIGN.md
# Verification — Cargo.lock is committed; cargo vet and cargo audit run in
# CI; the cargo-tree snapshot makes any dependency-graph movement a
# reviewable diff, not a lockfile blur).
#
# Third-party actions are pinned by commit SHA, and there is exactly one
# (checkout, with persist-credentials off: both jobs compile dozens of
# third-party build scripts via cargo, which must never find a token on
# disk — read access to public code needs none). The toolchain comes from
# the runner's own rustup, and the audit tools install from crates.io
# version-pinned with --locked — every remaining moving part is one the
# dependency policy already governs. No cache action: a few minutes of
# cargo install per run is cheaper than another pinned third-party
# dependency to vet. The toolchain FLOATS on stable by decision: the MSRV
# floor lives in Cargo.toml (rust-version), and catching a new stable's
# breakage in CI is the point, not a hazard.
#
# Deployment dependency, not expressible here: all three jobs must be
# listed as required status checks in branch protection, or a red job
# cannot block a merge. The jobs are parallel on purpose (no needs:).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref: a force-push or rapid PR update cancels the superseded
# run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - name: fmt + clippy + check + test (the make check gate)
        run: make check
      - name: MSRV floor (rust-version = 1.93; the Cargo.toml note)
        # Stable 1.93, not kani's nightly: the nightly ACCEPTS feature-gated
        # code the declared floor rejects, so stable is the stricter oracle.
        # --all-targets closes the cfg(test) gap the prove build never sees.
        run: |
          rustup toolchain install --no-self-update 1.93
          cargo +1.93 check --all-targets

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup update --no-self-update stable && rustup default stable
      - name: install audit tools (version-pinned, locked)
        # Pinned versions, bumped by diff like any dependency — an unpinned
        # install would let a new tool release change vet/audit semantics
        # with no reviewable change in this repo.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-vet --version 0.10.2 --locked
      - name: advisory scan
        run: make audit
      - name: vet the dependency tree
        run: cargo vet --locked
      - name: dependency-graph diff against the committed snapshot
        run: make tree-check

  prove:
    name: prove
    # Kani publishes a prebuilt x86_64-linux bundle; `cargo kani setup`
    # fetches it plus its own pinned nightly — the toolchain Cargo.toml's
    # rust-version holds the crate under. No cache action, per the decision
    # above. prove-kill runs here deliberately: the ephemeral checkout is
    # where its apply/revert cycle is structurally harmless, and killer
    # patches bitrot only detectably by being run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install kani (version-pinned, locked)
        # 0.67.0 matches KANI_VERSION in the Makefile — bump together, by diff.
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: inventories agree (harnesses and killers vs source)
        run: make prove-check
      - name: run the proof harnesses (pinned prover, exact count, covers gated)
        run: make prove
      - name: every proof goes red under its killer patch
        run: make prove-kill
      - name: newer Kani release probe (warning only)
        # The raise condition in the Cargo.toml note fired late once before
        # (the unblock came from rusqlite, not Kani) — this step makes the
        # Kani side self-announcing without turning unrelated PRs red.
        # Authenticated (via env, never inline interpolation): anonymous
        # API calls share a 60/hour per-IP limit on hosted runners, whose
        # exhaustion would silently suppress the one warning this exists
        # to emit. Empty $latest still short-circuits quiet on a failed
        # fetch — the probe must never be the thing that breaks CI.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/model-checking/kani/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          if [ -n "$latest" ] && [ "$latest" != "kani-0.67.0" ]; then
            echo "::warning title=Kani released $latest::check its bundled toolchain — if >= 1.95, raise rust-version and KANI_VERSION together (Cargo.toml MSRV note)"
            exit 1
          fi
