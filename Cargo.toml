[package]
name = "ghgraph"
version = "0.1.0"
edition = "2024"
# MSRV 1.93: the prover's toolchain sets the floor. Kani 0.67 (KANI_VERSION
# in the Makefile — bump the two together) pins nightly-2025-11-21, a 1.93
# nightly; the proofs compile this whole crate under it, and cargo refuses
# any package whose DECLARED rust-version exceeds the toolchain — so ours
# must not. The dependencies no longer constrain this: rusqlite 0.40.2 /
# libsqlite3-sys 0.38.2 polyfilled away the std cfg_select! (stable 1.95,
# rustc E0658 on older toolchains — the deps declare no rust-version of
# their own) that briefly forced a 1.95 floor here. Our own std minimum is
# 1.89 (std::fs::File::try_lock, the sync run lock), subsumed. When a Kani
# release ships a ≥ 1.95 toolchain (watch model-checking/kani#4685), raise
# this and KANI_VERSION in the same change. Verified by building + testing
# under nightly-2025-11-21; CI pins a stable 1.93 check leg.
rust-version = "1.93"
license = "Apache-2.0"
description = "Sync your GitHub work — pull requests, review threads, issues — into local SQLite; query it offline from the CLI, in JSON."
repository = "https://github.com/chainguard-sandbox/ghgraph"
keywords = ["github", "cli", "sqlite", "pull-requests"]
categories = ["command-line-utilities", "development-tools"]

# `harness` gates the Serialize derives on the parse types (src/parse.rs):
# only the fuzz workspace enables it, so shipped builds cannot serialize
# API-derived data even by accident — the claim is a compile error, not prose.
[features]
harness = []

# Dependency policy: every entry justified here, tree audited with `cargo vet`.
# Network transport is the `gh` CLI as a subprocess — auth, SSO, retries, and
# TLS are gh's problem, so no HTTP or TLS crates appear below.
[dependencies]
# The archive. `bundled` compiles SQLite (FTS5 included) into the binary so
# behavior never skews with a system libsqlite3. The only C in the build.
rusqlite = { version = "0.40", features = ["bundled"] }
# JSON in (GraphQL responses from the gh subprocess) and JSON out (the stdout
# contract: one JSON document, nothing else).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CLI surface: subcommands, flags, generated --help. The one ergonomics dep.
# Default features off: color and "did you mean" suggestions cost ~7 crates
# (anstream/anstyle/strsim) for styling on a tool whose output is JSON.
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
