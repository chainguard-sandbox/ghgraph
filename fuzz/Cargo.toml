# Fuzz harness — NOT part of the shipped crate or the default build. It is its
# own workspace, so `cargo build`/`make check` at the repo root never see it and
# the four-dependency floor of the binary is untouched. `libfuzzer-sys` is a
# fuzz-only dependency; targets reach the code under test through the `ghgraph`
# library crate (hence the src/lib.rs split).
[package]
name = "ghgraph-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.ghgraph]
path = ".."
# `harness` turns on the parse types' Serialize derives, which the
# response_parse round-trip witness needs; shipped builds never enable it.
features = ["harness"]

[[bin]]
name = "config_gate"
path = "fuzz_targets/config_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rfc3339_parse"
path = "fuzz_targets/rfc3339_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "epoch_arith"
path = "fuzz_targets/epoch_arith.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_gate"
path = "fuzz_targets/identity_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_parse"
path = "fuzz_targets/response_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_tokens"
path = "fuzz_targets/scrub_tokens.rs"
test = false
doc = false
bench = false

# Own workspace so the root `cargo build` never descends into the fuzz crate.
[workspace]
