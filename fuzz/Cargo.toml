# Fuzz harness — NOT part of the shipped crate or the default build. It is its
# own workspace, so `cargo build`/`make check` at the repo root never see it and
# the four-dependency floor of the binary is untouched. `libfuzzer-sys` is a
# fuzz-only dependency; targets reach the code under test through the `ghgraph`
# library crate (hence the src/lib.rs split).
[package]
name = "ghgraph-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Derived Arbitrary for the attention_derive signal structs. Fuzz-only, like
# libfuzzer-sys; the shipped crate's four-dependency floor is untouched.
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.ghgraph]
path = ".."
# `harness` turns on the parse types' Serialize derives, which the
# response_parse round-trip witness needs; shipped builds never enable it.
features = ["harness"]

[[bin]]
name = "config_gate"
path = "fuzz_targets/config_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rfc3339_parse"
path = "fuzz_targets/rfc3339_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "epoch_arith"
path = "fuzz_targets/epoch_arith.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identity_gate"
path = "fuzz_targets/identity_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "response_parse"
path = "fuzz_targets/response_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scrub_tokens"
path = "fuzz_targets/scrub_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gh_version"
path = "fuzz_targets/gh_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "refs_extract"
path = "fuzz_targets/refs_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_url"
path = "fuzz_targets/remote_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_terms"
path = "fuzz_targets/query_terms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sync_incomplete"
path = "fuzz_targets/sync_incomplete.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attention_derive"
path = "fuzz_targets/attention_derive.rs"
test = false
doc = false
bench = false

# Own workspace so the root `cargo build` never descends into the fuzz crate.
[workspace]

[[bin]]
name = "attention_inputs"
path = "fuzz_targets/attention_inputs.rs"
test = false
doc = false
